name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Сгенерировать Prisma-клиент
        run: pnpm --filter web exec prisma generate

      # Проверка типов ОБЯЗАТЕЛЬНА: раньше стояло «|| true», и обращения к
      # несуществующим полям БД (contacts, ogrnDate, email) доезжали до прода.
      - name: Проверка типов
        run: pnpm --filter web typecheck

      # Линтер пока информационный: в коде ~29 legacy-ошибок (в основном
      # неиспользуемые переменные). После чистки мёртвого кода станет обязательным.
      - name: Линтер (информационно)
        run: pnpm --filter web lint || true

      - name: Тесты
        run: pnpm --filter web run --if-present test:run
