name: Deploy to production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/dogovora-web
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/dogovora-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.worker
          push: true
          tags: ${{ env.IMAGE_WORKER }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /app
            git pull origin main
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u worksavinov-rgb --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env.production pull web worker
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d web worker
            docker image prune -f
