server {
    listen 80;
    server_name app.dogodoc.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.dogodoc.ru;

    ssl_certificate /etc/letsencrypt/live/app.dogodoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dogodoc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        # Docker DNS — резолвит имя контейнера динамически при каждом запросе,
        # иначе nginx кэширует IP и падает в 502 после перезапуска web-контейнера
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://web:3000;

        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE (чат с ИИ)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
