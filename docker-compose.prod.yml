services:
  web:
    image: ghcr.io/worksavinov-rgb/dogovora-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PROJECT: ${LOG_PROJECT:-dogovora}
      LOG_SERVICE: web
      LOG_ENV: ${LOG_ENV:-production}
    ports:
      - "3000:3000"
    volumes:
      - ${LOGS_HOST_DIR:-./logs}:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  worker:
    image: ghcr.io/worksavinov-rgb/dogovora-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      LOG_DIR: ${LOG_DIR:-/app/logs}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PROJECT: ${LOG_PROJECT:-dogovora}
      LOG_SERVICE: worker
      LOG_ENV: ${LOG_ENV:-production}
    volumes:
      - ${LOGS_HOST_DIR:-./logs}:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dogovora
      POSTGRES_USER: dogovora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogovora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  certbot_www:

networks:
  app-network:
    driver: bridge
